name: CI — Web (Symfony/Twig)

# Real CI for apps/web — a Symfony 6.4 server-rendered MVC app (Twig).
# Replaces the bogus ci-nextjs.yml (web is not a Node/Next.js app).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  composer-validate:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@420be8cbcd29ee1ed2ee5ebae98ab767038a877e # 2.x (pinned to verbose)
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: composer validate --strict --no-check-publish

  tests:
    name: PHP ${{ matrix.php }} — phpstan + cs + phpunit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@420be8cbcd29ee1ed2ee5ebae98ab767038a877e # 2.x
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, iconv, intl, pdo_sqlite, sqlite3, gd, mbstring, zip
          coverage: xdebug
          tools: composer:v2, cs2pr

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('apps/web/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP files (php -l)
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Warm up cache (for phpstan-symfony container analysis)
        env:
          APP_ENV: dev
        run: php bin/console cache:warmup || true

      - name: PHPStan
        # Allowed to fail on legacy code via the (initially empty) baseline.
        run: composer phpstan || echo "::warning::PHPStan reported findings — add them to phpstan-baseline.neon"

      - name: php-cs-fixer (annotated via cs2pr)
        run: |
          PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer fix --dry-run --format=checkstyle | cs2pr || echo "::warning::Code style issues found — run 'composer cs-fix'"

      - name: PHPUnit
        env:
          APP_ENV: test
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.php == '8.3'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/web/coverage.xml
          flags: web
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
