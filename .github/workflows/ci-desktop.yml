name: CI — Desktop (JavaFX)

# Real CI for apps/desktop (JavaFX 21 + Maven). Runs the already-present
# JUnit5 / TestFX(monocle headless) / JaCoCo suite via `mvn verify`
# (the previous ci-java.yml only ran `mvn compile`).

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ci-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/desktop

jobs:
  verify:
    name: mvn verify (headless tests + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 21 (Liberica Full — bundles JavaFX)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica
          java-version: "21"
          java-package: jdk+fx
          cache: maven

      - name: Headless display libs (TestFX/Monocle smoke deps)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libgtk-3-0 libxtst6 xvfb

      - name: Build, test & cover (headless)
        run: xvfb-run -a mvn -B --no-transfer-progress verify

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/desktop/target/site/jacoco/jacoco.xml
          flags: desktop
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-surefire-reports
          path: apps/desktop/target/surefire-reports/
          if-no-files-found: ignore
