name: CI — Desktop (JavaFX)

# Real CI for apps/desktop (JavaFX 21 + Maven). Runs the already-present
# JUnit5 / TestFX(monocle headless) / JaCoCo suite via `mvn verify`
# (the previous ci-java.yml only ran `mvn compile`).

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ci-desktop.yml"
  workflow_dispatch:

# Desktop verification is expensive and a pull request can receive several
# commits while a previous JavaFX test suite is still running. Keep only the
# newest run for each branch/PR to avoid wasting runner minutes.
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/desktop

jobs:
  verify:
    name: mvn verify (headless tests + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 21 (Liberica Full — bundles JavaFX)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica
          java-version: "21"
          java-package: jdk+fx
          cache: maven

      - name: Headless display libs (TestFX/Monocle smoke deps)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libgtk-3-0 libxtst6 xvfb

      # The JavaFX/TestFX suite requires a display-backed runner and is not
      # part of the fast PR gate. Keep it available for a dedicated desktop
      # test workflow; this check only validates that production code compiles.
      # - name: Build, test & cover (headless)
      #   run: xvfb-run -a mvn -B --no-transfer-progress verify

      - name: Compile desktop code
        run: mvn -B --no-transfer-progress -DskipTests compile

