name: Supply chain — OSV-Scanner + SBOM

# Polyglot supply-chain pass over every lockfile in the monorepo in one job:
#   - OSV-Scanner: pom.xml + composer.lock + pubspec.lock(.yaml) + package-lock.json
#   - CycloneDX SBOM via cdxgen (one aggregated bom.json for the whole repo)
# The installer-specific SLSA provenance lives in release-desktop.yml (built
# artifacts get attestations there, not here).
#
# Actions are SHA-pinned (supply-chain hygiene applies to the workflow too).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Security scans remain strict; cancel only superseded runs for the same PR/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: CycloneDX SBOM + OSV vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"

      - name: Generate aggregated CycloneDX SBOM
        # cdxgen walks the repo and produces one CycloneDX BOM covering the
        # Maven, Composer, npm, and pub ecosystems. FETCH_LICENSE off keeps it
        # offline-friendly and fast in CI.
        env:
          FETCH_LICENSE: "false"
        # Flutter dependency resolution is represented by pubspec.lock. Exclude
        # platform scaffolding: cdxgen otherwise tries to build Android without
        # an SDK local.properties and to parse iOS without a Podfile.lock.
        run: >-
          npx --yes @cyclonedx/cdxgen@11.11.0 -r --no-install-deps -o bom.json
          --exclude 'apps/mobile/android/**'
          --exclude 'apps/mobile/ios/**'
          .

      - name: Scan the generated SBOM for known vulnerabilities
        # Scanning the aggregate SBOM keeps transitive dependency coverage while
        # avoiding a second Maven resolution. The desktop app uses a JitPack
        # commit dependency, which deps.dev cannot resolve from pom.xml.
        uses: google/osv-scanner-action/osv-scanner-action@7222d1c7ee4f96d71d883e0d3c603f1e1705eca9 # v2.3.5
        with:
          scan-args: |-
            -L bom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rakcha-sbom-cyclonedx
          path: bom.json
          if-no-files-found: error
