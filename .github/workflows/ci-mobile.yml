name: CI — Mobile (Flutter)

# CI for apps/mobile (FlutterFlow-exported app). `flutter analyze` and
# `flutter test` are scoped to HAND-WRITTEN code: analysis_options.yaml
# excludes lib/flutter_flow, lib/custom_code and lib/backend (generated).

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze-and-test:
    name: analyze + test (hand-written code)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting (hand-written dirs only)
        run: dart format --output=none --set-exit-if-changed lib/concierge test || echo "::warning::dart format would change files"

      - name: Analyze (scoped via analysis_options.yaml excludes)
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/mobile/coverage/lcov.info
          flags: mobile
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
