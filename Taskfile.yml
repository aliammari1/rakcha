version: "3"

tasks:
  # ─── Desktop (Java 21 / Maven) ───
  desktop:build:
    dir: apps/desktop
    cmds:
      - mvn clean install -DskipTests

  desktop:run:
    dir: apps/desktop
    cmds:
      - mvn javafx:run

  desktop:test:
    dir: apps/desktop
    cmds:
      - mvn test

  # ─── Web (Symfony 6.4 / Composer) ───
  web:install:
    dir: apps/web
    cmds:
      - composer install
    desc: Install PHP deps (no Node build — the dead Encore/JS was removed)

  web:dev:
    dir: apps/web
    cmds:
      - symfony server:start -d
    desc: Start Symfony dev server (detached) — requires Symfony CLI (https://symfony.com/download)

  web:test:
    dir: apps/web
    cmds:
      - composer test

  web:phpstan:
    dir: apps/web
    cmds:
      - composer phpstan

  web:migrate:
    dir: apps/web
    cmds:
      - php bin/console doctrine:migrations:migrate --no-interaction

  # ─── Mobile (Flutter / Dart) ───
  mobile:get:
    dir: apps/mobile
    cmds:
      - flutter pub get

  mobile:run:
    dir: apps/mobile
    cmds:
      - flutter run

  mobile:build:apk:
    dir: apps/mobile
    cmds:
      - flutter build apk

  mobile:build:ios:
    dir: apps/mobile
    cmds:
      - flutter build ios
    desc: macOS only — cannot run on Linux or Windows

  mobile:test:
    dir: apps/mobile
    cmds:
      - flutter test

  # ─── Cross-project ───
  test:all:
    cmds:
      - task: desktop:test
      - task: web:test
      - task: mobile:test

  setup:
    desc: First-time setup for all apps
    cmds:
      - task: web:install
      - task: mobile:get
      - task: desktop:build

  # NOTE: there is intentionally no `api:generate` task. The three apps are
  # independent (JDBC desktop, Twig web, Firebase mobile) and there is no shared
  # REST API — the old OpenAPI stub + generator config were removed as vaporware.
  docs:serve:
    cmds:
      - mkdocs serve

  docs:build:
    cmds:
      - mkdocs build --strict