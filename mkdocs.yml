site_name: RAKCHA Docs
site_description: >-
  RAKCHA — a polyglot cinema platform: a JavaFX desktop app, a Symfony/Twig web
  app, a FlutterFlow mobile app, and Firebase functions. Three INDEPENDENT apps,
  no shared REST API.
site_author: Ali Ammari
copyright: Copyright &copy; 2023-2026 Ali Ammari & RAKCHA Contributors

# Pin a known-good Material version (Material entered maintenance Nov 2025).
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Desktop (JavaFX): apps/desktop.md
  - Web (Symfony/Twig): apps/web.md
  - Mobile (FlutterFlow): apps/mobile.md
  - Firebase functions & AI: apps/functions.md
  - Database schema: database.md
  - Engineering decisions: decisions.md
