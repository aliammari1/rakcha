name: rakcha_mobile
description: "Comprehensive Flutter app for cinema management, film cataloging, and e-commerce"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.5
  shared_preferences: ^2.2.0
  get: ^4.7.3
  intl: ^0.20.0
  path_provider: ^2.1.5
  cached_network_image: ^3.4.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
