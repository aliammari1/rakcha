# Content-Security-Policy + hardening headers for the Symfony/Twig app.
# See https://github.com/nelmio/NelmioSecurityBundle
#
# Honest scope note: the 71 Twig templates contain ~46 inline <script> blocks
# and many inline style="" attributes, and pull assets from a handful of CDNs
# (jsDelivr is dominant). A strict nonce-only CSP would require rewriting every
# template, so this baseline CSP:
#   - locks the host allowlist down to the CDNs actually used, AND
#   - keeps 'unsafe-inline' for script/style as a documented, temporary
#     allowance. Migrating the inline blocks to nonces (drop 'unsafe-inline')
#     is tracked in the modernization backlog.
# Even with 'unsafe-inline', this CSP blocks unlisted hosts/objects/frames and
# is a large improvement over having no CSP at all (the prior state).
nelmio_security:
    # Force HTTPS in browsers (skipped in dev/test below).
    forced_ssl:
        hsts_max_age: 31536000        # 1 year
        hsts_subdomains: true
        hsts_preload: true

    # Block clickjacking; legacy header kept alongside the CSP frame-ancestors.
    clickjacking:
        paths:
            "^/.*": DENY

    # Stop MIME sniffing.
    content_type:
        nosniff: true

    # Limit Referer leakage.
    referrer_policy:
        enabled: true
        policies:
            - "no-referrer-when-downgrade"
            - "strict-origin-when-cross-origin"

    csp:
        enabled: true
        # Report-friendly: enforce, but compatibility-first (see note above).
        enforce:
            default-src:
                - "'self'"
            # jsDelivr + the other CDNs the templates load. 'unsafe-inline' and
            # 'unsafe-eval' are required by the current inline blocks / some CDN
            # widgets; remove once inline scripts move to nonces.
            script-src:
                - "'self'"
                - "'unsafe-inline'"
                - "'unsafe-eval'"
                - "https://cdn.jsdelivr.net"
                - "https://cdnjs.cloudflare.com"
                - "https://cdn.datatables.net"
                - "https://code.jquery.com"
                - "https://ajax.googleapis.com"
                - "https://unpkg.com"
                - "https://kit.fontawesome.com"
                - "https://buttons.github.io"
                - "https://js.stripe.com"
                - "https://www.creative-tim.com"
            style-src:
                - "'self'"
                - "'unsafe-inline'"
                - "https://cdn.jsdelivr.net"
                - "https://cdnjs.cloudflare.com"
                - "https://cdn.datatables.net"
                - "https://fonts.googleapis.com"
                - "https://kit.fontawesome.com"
                - "https://unpkg.com"
            font-src:
                - "'self'"
                - "data:"
                - "https://cdn.jsdelivr.net"
                - "https://cdnjs.cloudflare.com"
                - "https://fonts.gstatic.com"
                - "https://kit.fontawesome.com"
                - "https://ka-f.fontawesome.com"
            img-src:
                - "'self'"
                - "data:"
                - "https:"          # film posters / user content come from many hosts
            connect-src:
                - "'self'"
                - "https://cdn.jsdelivr.net"
                - "https://ka-f.fontawesome.com"
                - "https://nominatim.openstreetmap.org"
                - "https://api.stripe.com"
            frame-src:
                - "'self'"
                - "https://www.youtube.com"
                - "https://js.stripe.com"
                - "https://www.google.com"
            object-src:
                - "'none'"
            base-uri:
                - "'self'"
            frame-ancestors:
                - "'none'"

# CSP + forced SSL get in the way of local dev and the test client.
when@dev:
    nelmio_security:
        forced_ssl:
            enabled: false

when@test:
    nelmio_security:
        forced_ssl:
            enabled: false
        csp:
            enabled: false
